# Every command needs an absolute real path and an explicit default.
# Rules are evaluated top-to-bottom; the first match wins.
# `*` matches within one argument and `**` matches zero or more arguments.

command rm /bin/rm
default rm allow

# Protect the trees themselves, their descendants, and recursive deletion of
# ancestors. Relative operands and existing symlink prefixes are resolved.
protect rm /etc
protect rm /var/lib

# The built-in recursive-root guard applies even when default is allow.
# It can only be disabled by the conspicuous escape hatch below:
# permit rm recursive-root


# Optional controls (choose limits and lock paths for your deployment):
# max-operands rm 20
# guard rm recursive-cwd
# lock-file rm /etc/outofdanger.STOP
